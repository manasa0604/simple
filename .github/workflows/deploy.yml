name: CI/CD to EKS

on:
  push:
    branches: [ "dev" ]  # Trigger on dev branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repo
        uses: actions/checkout@v3

      # 2. Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-1

      # 3. Login to Amazon ECR
      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Build & push Docker image to ECR
      - name: Build and push Docker image
        run: |
          IMAGE_TAG=latest
          ECR_REGISTRY=${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY=${{ secrets.ECR_REPOSITORY }}
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # 5. Update kubeconfig to connect to EKS
      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region us-west-1 --name ${{ secrets.CLUSTER_NAME }}

      # 6. Deploy to EKS
      - name: Deploy to EKS
        run: |
          kubectl apply -f k8s.yaml
          kubectl rollout status deployment/nodeapp
